<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>דשבורד - ג'פניקה אוניברסיטה</title>
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Heebo', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #fff;
            min-height: 100vh;
            padding: 2rem;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            background: linear-gradient(135deg, #D32F2F 0%, #B71C1C 100%);
            padding: 2rem;
            border-radius: 15px;
            margin-bottom: 2rem;
            box-shadow: 0 5px 20px rgba(211, 47, 47, 0.3);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-text h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
        }

        .header-text p {
            color: rgba(255, 255, 255, 0.9);
            font-size: 1.1rem;
        }

        .refresh-btn {
            background: rgba(255, 255, 255, 0.2);
            color: #fff;
            border: 2px solid rgba(255, 255, 255, 0.3);
            padding: 0.75rem 1.5rem;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            transition: all 0.3s;
        }

        .refresh-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 2rem;
            border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: all 0.3s;
        }

        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .stat-label {
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.9rem;
            margin-bottom: 0.5rem;
        }

        .stat-value {
            font-size: 2.5rem;
            font-weight: 700;
            color: #fff;
            margin-bottom: 0.25rem;
        }

        .stat-change {
            font-size: 0.85rem;
            color: #4ade80;
        }

        .details-section {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            padding: 2rem;
            border-radius: 15px;
        }

        .details-section h2 {
            font-size: 1.8rem;
            margin-bottom: 1.5rem;
        }

        .detail-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
        }

        .detail-item {
            background: rgba(255, 255, 255, 0.05);
            padding: 1rem;
            border-radius: 10px;
        }

        .detail-label {
            color: rgba(255, 255, 255, 0.6);
            font-size: 0.85rem;
            margin-bottom: 0.25rem;
        }

        .detail-value {
            font-size: 1.3rem;
            font-weight: 600;
            color: #fff;
        }

        .loading {
            text-align: center;
            padding: 3rem;
            color: rgba(255, 255, 255, 0.7);
        }

        .spinner {
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            border-top: 3px solid #fff;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 1rem;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @media (max-width: 768px) {
            body {
                padding: 1rem;
            }
            
            .header {
                flex-direction: column;
                gap: 1rem;
            }
            
            .header h1 {
                font-size: 1.8rem;
            }
            
            .stat-value {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="header-text">
                <h1>🍣 ג'פניקה אוניברסיטה ת"א</h1>
                <p>נתונים בזמן אמת | <span id="lastUpdate">--</span></p>
            </div>
            <button class="refresh-btn" onclick="loadData()">🔄 רענן</button>
        </div>

        <div id="loading" class="loading">
            <div class="spinner"></div>
            <p>טוען נתונים...</p>
        </div>

        <div id="content" style="display: none;">
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-label">מחזור היום (₪)</div>
                    <div class="stat-value" id="totalRevenue">--</div>
                    <div class="stat-change" id="revenueInfo">--</div>
                </div>
                
                <div class="stat-card">
                    <div class="stat-label">הזמנות שנסגרו</div>
                    <div class="stat-value" id="closedOrders">--</div>
                    <div class="stat-change">הזמנות שהושלמו</div>
                </div>
                
                <div class="stat-card">
                    <div class="stat-label">הזמנות פתוחות</div>
                    <div class="stat-value" id="openOrders">--</div>
                    <div class="stat-change" id="openInfo">--</div>
                </div>
                
                <div class="stat-card">
                    <div class="stat-label">ממוצע הזמנה (₪)</div>
                    <div class="stat-value" id="avgOrder">--</div>
                    <div class="stat-change">לפי הזמנות סגורות</div>
                </div>
            </div>

            <div class="details-section">
                <h2>📊 פירוט מלא</h2>
                <div class="detail-grid">
                    <div class="detail-item">
                        <div class="detail-label">סה״כ סועדים</div>
                        <div class="detail-value" id="totalDiners">--</div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-label">מחזור פתוח (₪)</div>
                        <div class="detail-value" id="openRevenue">--</div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-label">מכירות נטו (₪)</div>
                        <div class="detail-value" id="netSales">--</div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-label">מע״מ (₪)</div>
                        <div class="detail-value" id="totalVat">--</div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-label">טיפים (₪)</div>
                        <div class="detail-value" id="tips">--</div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-label">הנחות (₪)</div>
                        <div class="detail-value" id="discounts">--</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Using local proxy to avoid CORS issues
        const PROXY_URL = window.location.hostname === 'localhost' 
            ? 'http://localhost:3456'
            : 'https://japanika-proxy.onrender.com'; // Will deploy to Render later

        async function getDailyTotals() {
            const response = await fetch(`${PROXY_URL}/api/daily-totals`);
            return await response.json();
        }

        function formatCurrency(amount) {
            if (!amount) return '₪0';
            const shekels = amount / 100;
            return `₪${shekels.toLocaleString('he-IL', { maximumFractionDigits: 0 })}`;
        }

        function formatNumber(num) {
            if (!num) return '0';
            return num.toLocaleString('he-IL');
        }

        async function loadData() {
            try {
                document.getElementById('loading').style.display = 'block';
                document.getElementById('content').style.display = 'none';
                
                const data = await getDailyTotals();
                
                if (data && data.totals) {
                    const totals = data.totals;
                    
                    // Main stats
                    document.getElementById('totalRevenue').textContent = formatCurrency(totals.totalPayments);
                    document.getElementById('closedOrders').textContent = formatNumber(totals.count);
                    
                    if (totals.count > 0) {
                        const avg = totals.totalPayments / totals.count;
                        document.getElementById('avgOrder').textContent = formatCurrency(avg);
                    }
                    
                    document.getElementById('revenueInfo').textContent = `${formatNumber(totals.count)} הזמנות`;
                    
                    // Open orders
                    if (totals.openOrders) {
                        document.getElementById('openOrders').textContent = formatNumber(totals.openOrders.totalCount);
                        document.getElementById('openInfo').textContent = `${formatNumber(totals.openOrders.diners)} סועדים`;
                        document.getElementById('openRevenue').textContent = formatCurrency(totals.openOrders.totalAmount);
                        document.getElementById('totalDiners').textContent = formatNumber(totals.openOrders.diners);
                    }
                    
                    // Details
                    document.getElementById('netSales').textContent = formatCurrency(totals.netSales);
                    document.getElementById('totalVat').textContent = formatCurrency(totals.totalVat);
                    document.getElementById('tips').textContent = formatCurrency(totals.tipsOnOrder);
                    document.getElementById('discounts').textContent = formatCurrency(totals.discounts);
                }
                
                document.getElementById('lastUpdate').textContent = new Date().toLocaleString('he-IL');
                document.getElementById('loading').style.display = 'none';
                document.getElementById('content').style.display = 'block';
                
            } catch (error) {
                console.error('Error loading data:', error);
                alert('שגיאה בטעינת נתונים. בדוק את ה-Console.');
            }
        }

        // Load on page load
        loadData();
    </script>
</body>
</html>
