<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>דשבורד אנליטיקה - ג'פניקה</title>
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Heebo', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #fff;
            min-height: 100vh;
        }

        /* Login Screen */
        .login-screen {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #D32F2F 0%, #8B0000 100%);
        }

        .login-box {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 3rem;
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            text-align: center;
            max-width: 400px;
            width: 90%;
        }

        .login-box h1 {
            font-size: 2rem;
            margin-bottom: 0.5rem;
            color: #fff;
        }

        .login-box p {
            color: rgba(255, 255, 255, 0.8);
            margin-bottom: 2rem;
        }

        .login-box input {
            width: 100%;
            padding: 1rem;
            border: 2px solid rgba(255, 255, 255, 0.3);
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            color: #fff;
            font-size: 1.1rem;
            text-align: center;
            margin-bottom: 1rem;
            transition: all 0.3s;
        }

        .login-box input:focus {
            outline: none;
            border-color: #fff;
            background: rgba(255, 255, 255, 0.2);
        }

        .login-box input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        .login-box button {
            width: 100%;
            padding: 1rem;
            background: #fff;
            color: #D32F2F;
            border: none;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
        }

        .login-box button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 255, 255, 0.3);
        }

        .error-message {
            color: #ffcccc;
            background: rgba(255, 0, 0, 0.2);
            padding: 0.75rem;
            border-radius: 8px;
            margin-bottom: 1rem;
            display: none;
        }

        /* Dashboard */
        .dashboard {
            display: none;
            padding: 2rem;
        }

        .dashboard.active {
            display: block;
        }

        .header {
            background: linear-gradient(135deg, #D32F2F 0%, #B71C1C 100%);
            padding: 2rem;
            border-radius: 15px;
            margin-bottom: 2rem;
            box-shadow: 0 5px 20px rgba(211, 47, 47, 0.3);
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
        }

        .header p {
            color: rgba(255, 255, 255, 0.9);
            font-size: 1.1rem;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 2rem;
            border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: all 0.3s;
        }

        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .stat-label {
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.9rem;
            margin-bottom: 0.5rem;
        }

        .stat-value {
            font-size: 2.5rem;
            font-weight: 700;
            color: #fff;
            margin-bottom: 0.25rem;
        }

        .stat-change {
            font-size: 0.85rem;
            color: #4ade80;
        }

        .stat-change.negative {
            color: #f87171;
        }

        .branches-section {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            padding: 2rem;
            border-radius: 15px;
            margin-bottom: 2rem;
        }

        .branches-section h2 {
            font-size: 1.8rem;
            margin-bottom: 1.5rem;
            color: #fff;
        }

        .branches-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1rem;
            max-height: 600px;
            overflow-y: auto;
            padding: 0.5rem;
        }

        .branch-card {
            background: rgba(255, 255, 255, 0.08);
            padding: 1.25rem;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.2s;
        }

        .branch-card:hover {
            background: rgba(255, 255, 255, 0.12);
            border-color: rgba(255, 255, 255, 0.3);
        }

        .branch-name {
            font-weight: 700;
            font-size: 1.1rem;
            margin-bottom: 0.5rem;
            color: #fff;
        }

        .branch-type {
            color: rgba(255, 255, 255, 0.6);
            font-size: 0.85rem;
            padding: 0.25rem 0.75rem;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            display: inline-block;
        }

        .loading {
            text-align: center;
            padding: 3rem;
            color: rgba(255, 255, 255, 0.7);
        }

        .spinner {
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            border-top: 3px solid #fff;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 1rem;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .logout-btn {
            position: fixed;
            top: 2rem;
            left: 2rem;
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 0.75rem 1.5rem;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.3s;
        }

        .logout-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .chart-section {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            padding: 2rem;
            border-radius: 15px;
            margin-bottom: 2rem;
        }

        .chart-section h2 {
            font-size: 1.8rem;
            margin-bottom: 1.5rem;
        }

        @media (max-width: 768px) {
            .dashboard {
                padding: 1rem;
            }
            
            .header h1 {
                font-size: 1.8rem;
            }
            
            .stat-value {
                font-size: 2rem;
            }
            
            .branches-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <!-- Login Screen -->
    <div class="login-screen" id="loginScreen">
        <div class="login-box">
            <h1>🍣 דשבורד ג'פניקה</h1>
            <p>אנליטיקה ונתונים בזמן אמת</p>
            <div class="error-message" id="errorMessage">סיסמה שגויה</div>
            <input type="password" id="passwordInput" placeholder="הזן סיסמה" autocomplete="off">
            <button onclick="login()">כניסה</button>
        </div>
    </div>

    <!-- Dashboard -->
    <div class="dashboard" id="dashboard">
        <button class="logout-btn" onclick="logout()">התנתק</button>
        
        <div class="header">
            <h1>🍣 דשבורד ניהול - רשת ג'פניקה</h1>
            <p>נתונים בזמן אמת מכל הסניפים</p>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-label">סה״כ סניפים</div>
                <div class="stat-value" id="totalBranches">--</div>
                <div class="stat-change">פעילים ברחבי הארץ</div>
            </div>
            
            <div class="stat-card">
                <div class="stat-label">מחזור היום (₪)</div>
                <div class="stat-value" id="todayRevenue">--</div>
                <div class="stat-change" id="revenueChange">טוען...</div>
            </div>
            
            <div class="stat-card">
                <div class="stat-label">הזמנות היום</div>
                <div class="stat-value" id="todayOrders">--</div>
                <div class="stat-change" id="ordersChange">טוען...</div>
            </div>
            
            <div class="stat-card">
                <div class="stat-label">ממוצע הזמנה (₪)</div>
                <div class="stat-value" id="avgOrder">--</div>
                <div class="stat-change">לפי נתוני היום</div>
            </div>
        </div>

        <div class="branches-section">
            <h2>📍 כל הסניפים</h2>
            <div class="loading" id="branchesLoading">
                <div class="spinner"></div>
                <p>טוען נתוני סניפים...</p>
            </div>
            <div class="branches-grid" id="branchesGrid" style="display: none;"></div>
        </div>
    </div>

    <script>
        const PASSWORD = 'ברק';
        const API_BASE = 'https://ros-rp.tabit.cloud';
        const CLIENT_ID = 'syiU5W2pTidPMXd5t5nTzg';
        let accessToken = null;
        let organizations = [];

        // Login
        function login() {
            const input = document.getElementById('passwordInput');
            const error = document.getElementById('errorMessage');
            
            if (input.value === PASSWORD) {
                document.getElementById('loginScreen').style.display = 'none';
                document.getElementById('dashboard').classList.add('active');
                sessionStorage.setItem('loggedIn', 'true');
                initDashboard();
            } else {
                error.style.display = 'block';
                input.value = '';
                setTimeout(() => error.style.display = 'none', 3000);
            }
        }

        // Logout
        function logout() {
            sessionStorage.removeItem('loggedIn');
            location.reload();
        }

        // Check if already logged in
        if (sessionStorage.getItem('loggedIn') === 'true') {
            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('dashboard').classList.add('active');
            initDashboard();
        }

        // Enter key to login
        document.getElementById('passwordInput')?.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') login();
        });

        // Get Access Token
        async function getAccessToken() {
            try {
                const response = await fetch(`${API_BASE}/oauth2/token`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded'
                    },
                    body: `grant_type=client_credentials&client_id=${CLIENT_ID}`
                });
                
                const data = await response.json();
                accessToken = data.access_token;
                return accessToken;
            } catch (error) {
                console.error('Error getting token:', error);
                return null;
            }
        }

        // Get Organizations
        async function getOrganizations() {
            if (!accessToken) await getAccessToken();
            
            try {
                const response = await fetch(`${API_BASE}/organizations`, {
                    headers: {
                        'Authorization': `Bearer ${accessToken}`,
                        'Content-Type': 'application/json'
                    }
                });
                
                const data = await response.json();
                organizations = data;
                return data;
            } catch (error) {
                console.error('Error fetching organizations:', error);
                return [];
            }
        }

        // Display Branches
        function displayBranches(orgs) {
            const grid = document.getElementById('branchesGrid');
            const loading = document.getElementById('branchesLoading');
            
            grid.innerHTML = '';
            
            // Sort by name
            const sortedOrgs = orgs.sort((a, b) => {
                const nameA = a.name?.he || a.name?.en || '';
                const nameB = b.name?.he || b.name?.en || '';
                return nameA.localeCompare(nameB, 'he');
            });
            
            sortedOrgs.forEach(org => {
                const card = document.createElement('div');
                card.className = 'branch-card';
                
                const name = org.name?.he || org.name?.en || 'לא ידוע';
                const type = org.type === 'hq' ? 'מטה' : 'סניף';
                
                card.innerHTML = `
                    <div class="branch-name">${name}</div>
                    <span class="branch-type">${type}</span>
                `;
                
                grid.appendChild(card);
            });
            
            loading.style.display = 'none';
            grid.style.display = 'grid';
            
            // Update total count
            document.getElementById('totalBranches').textContent = orgs.length;
        }

        // Initialize Dashboard
        async function initDashboard() {
            // Get organizations
            const orgs = await getOrganizations();
            displayBranches(orgs);
            
            // Mock data for demo (replace with real API calls later)
            document.getElementById('todayRevenue').textContent = '₪342,750';
            document.getElementById('revenueChange').textContent = '↑ 12% מאתמול';
            document.getElementById('revenueChange').className = 'stat-change';
            
            document.getElementById('todayOrders').textContent = '1,247';
            document.getElementById('ordersChange').textContent = '↑ 8% מאתמול';
            document.getElementById('ordersChange').className = 'stat-change';
            
            document.getElementById('avgOrder').textContent = '₪275';
        }
    </script>
</body>
</html>
